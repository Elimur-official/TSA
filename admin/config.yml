backend:
  name: git-gateway
  branch: main

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: products
    label: Товары
    label_singular: Товар
    folder: src/content/products
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{fields.id}}"
    identifier_field: name
    summary: "№{{fields.id}} · {{name}} · {{price}} ₽"
    fields:
      - label: "Номер товара"
        name: id
        widget: number
        value_type: int
        min: 1
        hint: "Уникальный номер. После публикации не менять — он зашит в ссылки и QR-коды на упаковке."
      - { label: Название, name: name, widget: string }
      - label: Категория
        name: category
        widget: string
        hint: "Например: Вибраторы, Массажёры, Смазки. Одинаковые названия объединяются в один фильтр на сайте."
      - { label: "Цена, ₽", name: price, widget: number, value_type: int, min: 0 }
      - label: "Старая цена, ₽"
        name: oldPrice
        widget: number
        value_type: int
        required: false
        hint: "Если заполнить — на сайте появится зачёркнутая цена и бейдж скидки. Указывайте только цену, по которой товар действительно продавался."
      - label: Фото
        name: image
        widget: image
        hint: "Квадратное фото, лучше от 800×800. Его же увидят в боте."
      - { label: Описание, name: description, widget: text }
      - label: "В наличии"
        name: inStock
        widget: boolean
        default: true
        required: false
      - label: Характеристики
        name: specs
        widget: list
        required: false
        fields:
          - { label: Название, name: key, widget: string }
          - { label: Значение, name: value, widget: string }
      - label: "С этим берут"
        name: related
        widget: list
        required: false
        field: { label: "Номер товара", name: related_id, widget: number, value_type: int }
        hint: "Номера сопутствующих товаров — покажутся блоком в карточке."
      - label: "Ссылка на гайд"
        name: guide
        widget: string
        required: false
        hint: "Адрес статьи без слэшей, например: s-chego-nachat. Оставьте пустым, если гайда нет."
      - label: "Доп. фото"
        name: images
        widget: list
        required: false
        field: { label: Фото, name: photo, widget: image }
        hint: "Если добавить два и больше — в карточке появится галерея с миниатюрами."

  - name: about
    label: О бренде
    files:
      - file: src/about.md
        label: Страница «О бренде»
        name: about
        fields:
          - { label: Заголовок, name: title, widget: string }
          - { label: Фото, name: heroImage, widget: image }
          - label: Статистика
            name: stats
            widget: list
            fields:
              - { label: Значение, name: value, widget: string }
              - { label: Подпись, name: label, widget: string }
          - label: Реквизиты
            name: legal
            widget: list
            fields:
              - { label: Поле, name: key, widget: string }
              - { label: Значение, name: value, widget: string }
          - { label: Текст, name: body, widget: markdown }
          - { label: Макет, name: layout, widget: hidden, default: "layouts/about.njk" }
          - { label: Ссылка, name: permalink, widget: hidden, default: "/about/" }

  - name: anonymity
    label: Анонимность
    files:
      - file: src/anonymity.md
        label: Страница «Анонимность»
        name: anonymity
        fields:
          - { label: Layout, name: layout, widget: hidden, default: layouts/anonymity.njk }
          - { label: Permalink, name: permalink, widget: hidden, default: /anonymity/ }
          - { label: Title, name: title, widget: hidden, default: Анонимность — elimur }
          - { label: Заголовок, name: heading, widget: string }
          - { label: Подводка, name: intro, widget: text }
          - label: Секции
            name: sections
            widget: list
            fields:
              - { label: Заголовок, name: title, widget: string }
              - { label: Текст, name: body, widget: text }
          - label: Фото посылки
            name: photos
            widget: list
            required: false
            field: { label: Фото, name: photo, widget: image }
          - { label: Текст, name: body, widget: hidden, default: "" }

  - name: reviews
    label: Отзывы
    folder: src/content/reviews
    create: true
    fields:
      - { label: Имя, name: name, widget: string }
      - { label: "Оценка (1-5)", name: rating, widget: number, min: 1, max: 5 }
      - { label: Дата, name: date, widget: datetime }
      - { label: Текст отзыва, name: body, widget: markdown }
      - { label: Теги, name: tags, widget: hidden, default: reviews }
      - { label: "Без отдельной страницы", name: permalink, widget: hidden, default: false }

  - name: articles
    label: Гайды
    folder: src/content/articles
    create: true
    fields:
      - { label: Заголовок, name: title, widget: string }
      - { label: "Время чтения", name: readTime, widget: string, default: "5 мин" }
      - { label: Обложка, name: cover, widget: image }
      - { label: "Текст статьи", name: body, widget: markdown }
      - { label: Макет, name: layout, widget: hidden, default: "layouts/article.njk" }
      - { label: Теги, name: tags, widget: hidden, default: articles }
      - { label: Ссылка, name: permalink, widget: hidden, default: "/articles/{{ page.fileSlug }}/" }

  - name: faq
    label: "FAQ и промо"
    files:
      - file: src/_data/faq.json
        label: "Вопросы и промокод"
        name: faq
        format: json
        fields:
          - label: Вопросы
            name: items
            widget: list
            fields:
              - { label: Вопрос, name: question, widget: string }
              - { label: Ответ, name: answer, widget: text }
          - label: "WB-промо"
            name: wbPromo
            widget: object
            fields:
              - { label: Заголовок, name: title, widget: string }
              - { label: Текст, name: text, widget: string }
              - { label: Бейдж, name: code, widget: string }
