<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111013">
<title>Тумбочка — эскиз каталога</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#faf8f6; --card:#fff; --tx:#17151a; --dim:#7d7580; --line:#eae4e6;
  --acc:#b3195f; --acc-tx:#fff; --badge:#f5e3ec; --badge-tx:#a3155a; --old:#a89ea6;
}
body[data-t="noch"]{
  --bg:#111013; --card:#1b191f; --tx:#f3eff4; --dim:#9a92a0; --line:#2b2830;
  --acc:#d94f8c; --acc-tx:#14121a; --badge:#2e2130; --badge-tx:#e79bbe; --old:#6f6674;
}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);
     padding-bottom:74px;transition:background .25s,color .25s}

/* ── ШАПКА: поиск закреплён, как на ВБ ── */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 14px 8px;
     border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.brand b{font-size:17px;letter-spacing:-.3px}
.brand .hide{font-size:12px;color:var(--dim);border:1px solid var(--line);
             padding:4px 9px;border-radius:20px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
        border-radius:12px;padding:10px 12px}
.search input{border:0;background:0;outline:0;color:var(--tx);font-size:15px;width:100%}
.search input::placeholder{color:var(--dim)}
/* ── ПОЛКИ строкой ── */
.chips{display:flex;gap:7px;overflow-x:auto;padding:9px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:13px;padding:7px 13px;border-radius:20px;
      background:var(--card);border:1px solid var(--line);color:var(--dim)}
.chip.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc);font-weight:600}
/* ── СЕТКА 2 колонки ── */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:4px 14px 20px}
.it{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);
    display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:3/4;background:var(--line);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.bd{position:absolute;top:7px;left:7px;font-size:10px;font-weight:700;background:var(--badge);
    color:var(--badge-tx);padding:3px 7px;border-radius:6px}
.fav{position:absolute;top:6px;right:6px;width:27px;height:27px;border-radius:50%;
     background:rgba(0,0,0,.35);color:#fff;border:0;font-size:14px;line-height:27px;text-align:center}
.in{padding:9px 10px 10px;display:flex;flex-direction:column;gap:5px;flex:1}
.pr{display:flex;align-items:baseline;gap:6px}
.pr b{font-size:16px;letter-spacing:-.3px}
.pr s{font-size:12px;color:var(--old)}
.tt{font-size:12.5px;line-height:1.32;color:var(--tx);opacity:.9;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:auto}
.noise{display:inline-flex;gap:2px}
.noise i{width:4px;height:4px;border-radius:50%;background:var(--dim);opacity:.35}
.noise i.on{opacity:1;background:var(--acc)}
.buy{margin-top:7px;border:0;border-radius:9px;background:var(--acc);color:var(--acc-tx);
     font-size:13px;font-weight:600;padding:9px 0;width:100%}
/* ── НИЖНЯЯ ПАНЕЛЬ — сердце «как приложение» ── */
.tab{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
     background:var(--card);border-top:1px solid var(--line);padding:7px 0 calc(7px + env(safe-area-inset-bottom))}
.tab a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;
       color:var(--dim);text-decoration:none;position:relative}
.tab a.on{color:var(--acc)}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7}
.cnt{position:absolute;top:-3px;right:50%;margin-right:-19px;background:var(--acc);color:var(--acc-tx);
     font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;line-height:15px;text-align:center}
/* ── переключатель палитры (только в эскизе) ── */
.sw{position:fixed;right:12px;bottom:88px;z-index:40;background:var(--card);border:1px solid var(--line);
    border-radius:22px;padding:7px 13px;font-size:12px;color:var(--tx);box-shadow:0 3px 14px rgba(0,0,0,.16)}
.note{padding:14px;font-size:11.5px;color:var(--dim);line-height:1.5;text-align:center}
</style>
</head>
<body data-t="den">

<div class="top">
  <div class="brand"><b>Тумбочка</b><span class="hide">спрятать экран</span></div>
  <div class="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7d7580" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input placeholder="Найти в Тумбочке">
  </div>
</div>

<div class="chips">
  <div class="chip on">Всё</div><div class="chip">Тихие</div><div class="chip">Соло</div>
  <div class="chip">Для двоих</div><div class="chip">Вакуум</div><div class="chip">С подогревом</div>
</div>

<div class="grid" id="grid"></div>
<div class="note">Эскиз одного экрана · 25.08.2026<br>Нажми кнопку справа — сменить палитру</div>

<button class="sw" onclick="var b=document.body;b.dataset.t=b.dataset.t==='den'?'noch':'den';
  this.textContent=b.dataset.t==='den'?'🌙 Ночная':'☀️ Дневная'">🌙 Ночная</button>

<nav class="tab">
  <a class="on" href="#"><svg viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-7H9v7H4a1 1 0 01-1-1z"/></svg>Главная</a>
  <a href="#"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Каталог</a>
  <a href="#"><svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg><span class="cnt">2</span>Корзина</a>
  <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Профиль</a>
</nav>

<script>
const T = [{"ph": "p0", "t": "Вакуумное виброяйцо с пультом", "n": 2490, "old": 3200, "tags": ["вакуум", "вибро", "пульт"], "noise": 1, "badge": "хит новичков"}, {"ph": "p1", "t": "Вибратор вакуумный со стимуляцией клитора", "n": 3190, "old": null, "tags": ["вакуум", "вибро"], "noise": 2, "badge": null}, {"ph": "p2", "t": "Мини-вибратор пуля", "n": 1590, "old": null, "tags": ["вибро"], "noise": 1, "badge": null}, {"ph": "p3", "t": "Вибратор с подогревом, двусторонний", "n": 3890, "old": 4900, "tags": ["вибро", "подогрев"], "noise": 1, "badge": null}, {"ph": "p4", "t": "Вибратор реалистичный с фрикциями и подогревом, с пультом", "n": 4690, "old": 6100, "tags": ["фрикции", "подогрев", "пульт", "вибро"], "noise": 2, "badge": "№1 по заказам"}, {"ph": "p5", "t": "Вибратор для куни, реалистичный язык с вакуумной стимуляцией", "n": 3990, "old": 4800, "tags": ["вакуум", "вибро"], "noise": 1, "badge": null}, {"ph": "p6", "t": "Вибратор, фаллоимитатор с фрикциями, с пультом и подогревом", "n": 4490, "old": null, "tags": ["фрикции", "подогрев", "пульт", "вибро"], "noise": 3, "badge": "мощный"}, {"ph": "p7", "t": "Реалистичный фаллоимитатор 16 см", "n": 2890, "old": null, "tags": ["без мотора"], "noise": 0, "badge": null}, {"ph": "p8", "t": "Виброяйцо на дистанционном управлении", "n": 2190, "old": null, "tags": ["вибро", "пульт"], "noise": 1, "badge": null}, {"ph": "p9", "t": "Вибратор с фрикциями, с подогревом и на присоске, с пультом", "n": 4290, "old": 5300, "tags": ["фрикции", "подогрев", "пульт", "присоска"], "noise": 2, "badge": null}];
document.getElementById('grid').innerHTML = T.map(function(p){
  var noise = p.noise ? '<span class="noise">' +
      [1,2,3].map(function(k){return '<i class="'+(k<=p.noise?'on':'')+'"></i>'}).join('') +
      '</span><span>' + (p.noise===1?'тише шёпота':p.noise===2?'слышно рядом':'шумный') + '</span>' : '';
  return '<div class="it">' +
    '<div class="ph"><img src="../prototip/img/'+p.ph+'.jpg" alt="" loading="lazy">' +
      (p.badge?'<span class="bd">'+p.badge+'</span>':'') +
      '<button class="fav">♡</button></div>' +
    '<div class="in">' +
      '<div class="pr"><b>'+p.n.toLocaleString('ru')+' ₽</b>' + (p.old?'<s>'+p.old.toLocaleString('ru')+' ₽</s>':'') + '</div>' +
      '<div class="tt">'+p.t+'</div>' +
      '<div class="meta">'+noise+'</div>' +
      '<button class="buy">В корзину</button>' +
    '</div></div>';
}).join('');
</script>
</body></html>
